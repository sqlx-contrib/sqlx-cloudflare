version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "cargo"
    # The test worker is its own package with its own lock, outside the
    # workspace; bump both together so their `worker` versions stay in step.
    directories:
      - "/"
      - "/crates/sqlx-cloudflare-d1/tests/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-cargo:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
